<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tune IL årshjul</title>
  <meta name="theme-color" content="#e4f4ec">
  <script>
    // Sett lyst/mørkt tema før siden tegnes, så den ikke blinker
    (function () {
      var p = 'lys';
      try { p = localStorage.getItem('arshjul-tema') || 'lys'; } catch (e) {}
      var dark = p === 'mork' || (p === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    })();
  </script>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <div class="hero-top">
        <div class="brand">
          <img src="icon.svg" alt="" class="brand-logo">
          <div>
            <h1>Tune IL årshjul</h1>
            <div class="brand-sub">Sesong <span id="season-label"></span> <span class="test-pill" title="Eksempeloppgaver. Avkrysninger lagres bare på denne enheten.">Test</span></div>
          </div>
        </div>
        <div class="hero-actions">
          <div class="view-switch" role="tablist" aria-label="Visning">
            <button type="button" data-action="view" data-view="hjul" role="tab">Hjul</button>
            <button type="button" data-action="view" data-view="liste" role="tab">Liste</button>
          </div>
          <button type="button" class="more-btn" data-action="more" aria-label="Mer og innstillinger">
            <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
          </button>
        </div>
      </div>

      <div class="progress" id="season-progress"></div>

      <div class="upcoming-head">
        <h2>Neste frister</h2>
      </div>
      <div class="upcoming" id="upcoming"></div>
    </div>
  </header>

  <section class="toolbar" aria-label="Filter">
    <div class="chips" id="unit-chips"></div>
    <div class="toolbar-row">
      <label class="select-wrap">
        <span class="sr-only">Verv</span>
        <select id="role-select"></select>
      </label>
      <label class="toggle">
        <input type="checkbox" id="hide-done">
        <span class="toggle-track" aria-hidden="true"></span>
        <span>Skjul fullførte</span>
      </label>
    </div>
  </section>

  <main>
    <section id="view-hjul" class="hjul-layout">
      <div class="wheel-card">
        <svg id="wheel" viewBox="-16 -16 432 432" role="group" aria-label="Årshjul"></svg>
        <div class="legend" id="legend"></div>
        <p class="wheel-hint">Trykk på en måned, dra rundt hjulet eller rull med musehjulet.</p>
      </div>
      <div class="month-panel">
        <div class="month-nav">
          <button type="button" class="icon-btn" data-action="prev" aria-label="Forrige måned">
            <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
          </button>
          <div class="month-heading">
            <h2 id="month-title"></h2>
            <div id="month-sub" class="month-sub"></div>
          </div>
          <button type="button" class="icon-btn" data-action="next" aria-label="Neste måned">
            <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
          </button>
        </div>
        <div id="month-tasks" class="task-list"></div>
      </div>
    </section>

    <section id="view-liste" class="list-view" hidden></section>
  </main>

  <button type="button" class="fab" data-action="new" aria-label="Ny oppgave">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <dialog id="task-form" class="modal" aria-label="Oppgave">
    <div class="sheet-inner" id="task-form-content"></div>
  </dialog>

  <dialog id="more" class="sheet" aria-label="Mer">
    <div class="sheet-inner" id="more-content"></div>
  </dialog>

  <script src="config.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
